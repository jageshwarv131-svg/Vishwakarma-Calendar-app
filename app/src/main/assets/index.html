<!DOCTYPE html>
<html lang="hi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VISHWAKARMA JI – पंचांग कैलेंडर</title>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Mukta:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e2d0;--card:#fffbe8;--ink:#1a1a1a;--blue:#1f2f8f;--navy:#2b2b86;--red:#d3202a;--yel:#fde85a;--gold:#ffd23d;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a17;--ink:#f0ead8}}
:root[data-theme="dark"]{--bg:#1b1a17;--ink:#f0ead8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);font-family:'Mukta',sans-serif;color:var(--ink);overscroll-behavior:none}
#app{height:100%;height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:auto;padding-top:env(safe-area-inset-top,0px)}
#app.cal header{display:none}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:linear-gradient(#ff9a1f,#d3202a);color:#fff;border-bottom:3px solid var(--gold)}
header .lg{width:34px;height:34px;border-radius:50%;background:radial-gradient(#ffe27a,#c47a00);display:grid;place-items:center;font-size:20px;border:2px solid #fff}
header b{font:400 19px 'Rozha One',serif;letter-spacing:1px;display:block;line-height:1.1}
header small{font-size:11px;opacity:.9}
main{flex:1;position:relative;overflow:hidden;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;display:none;padding:10px}
.view.on{display:block}
#v-cal{padding:0;overflow:hidden}
nav{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:1px solid #0003;box-shadow:0 -3px 12px #0003;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:0;border:0;color:#6b6f9a;padding:7px 0 5px;font:800 10.5px Mukta;display:flex;flex-direction:column;align-items:center;gap:5px}
nav button.on{color:var(--navy)}
.ic{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;position:relative;transition:transform .25s,box-shadow .25s}
.ic::after{content:"";position:absolute;inset:1px 1px 50% 1px;border-radius:12px 12px 50% 50%;background:linear-gradient(#fff7,#fff0)}
.ic svg{width:26px;height:26px;position:relative;z-index:1;filter:drop-shadow(0 2px 1px #0006)}
.c1{background:linear-gradient(145deg,#4a52c9,#1f2f8f);box-shadow:0 4px 0 #141f63,0 8px 10px #0004}
.c2{background:linear-gradient(145deg,#ffa63d,#d3202a);box-shadow:0 4px 0 #8f1218,0 8px 10px #0004}
.c3{background:linear-gradient(145deg,#4cb36d,#2a8a4a);box-shadow:0 4px 0 #1b5d31,0 8px 10px #0004}
nav button:active .ic{transform:translateY(3px);box-shadow:0 1px 0 #0006,0 2px 4px #0004}
nav button.on .ic{animation:lift 2.4s ease-in-out infinite}
@keyframes lift{0%,100%{transform:perspective(260px) translateY(-5px) rotateX(10deg) rotateY(-8deg)}50%{transform:perspective(260px) translateY(-8px) rotateX(10deg) rotateY(8deg)}}
.fl{transform-origin:16px 14px;animation:fl 1.1s ease-in-out infinite alternate}
@keyframes fl{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.92,1.12) rotate(3deg)}}
nav button.on .pn2{animation:wr 1.1s ease-in-out infinite alternate}
@keyframes wr{to{transform:translate(-2px,2px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.mh{font:400 14px 'Rozha One',serif;color:var(--navy);padding:8px 0 2px;border-bottom:2px solid var(--navy)}
.row.now{background:#fff3b0;border-radius:8px}
.card{background:var(--card);border:2px solid #333;border-radius:10px;padding:10px;margin-bottom:10px;color:#1a1a1a}
.card h3{margin:-10px -10px 8px;padding:4px 10px;color:#fff;font:400 15px 'Rozha One',serif;border-radius:8px 8px 0 0;background:var(--navy)}
.row{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed #aaa;font-size:14px}
.row .dd{min-width:56px;text-align:center;font:400 22px/1.1 'Rozha One',serif;color:var(--blue)}
.row .dd small{display:block;font:700 10px 'Mukta';color:#555}
.row.h .dd,.row.h{color:var(--red)}
.tag{background:var(--red);color:#fff;border-radius:8px;font-size:10px;padding:0 7px;margin-left:6px;font-weight:800}
textarea{width:100%;min-height:80px;border:1px solid #888;border-radius:8px;padding:6px;font:500 15px 'Mukta';background:repeating-linear-gradient(#fffbe8,#fffbe8 25px,#bbb 26px);line-height:26px;color:#1a1a1a}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{border:2px solid var(--navy);background:var(--card);color:var(--navy);border-radius:16px;padding:4px 12px;font:800 13px 'Mukta'}
.chips button.on{background:var(--navy);color:#fff}
.note{font-size:11px;opacity:.75;padding:4px 2px 12px}
.stage{position:absolute;inset:0;perspective:1200px;background:#333;overflow:hidden}
.page{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--card);transform-origin:top center;backface-visibility:hidden;color:#1a1a1a;box-shadow:0 6px 20px #0008}
.top{flex:none;display:grid;grid-template-columns:1fr 82px 1fr;border-bottom:2px solid #333;font-size:7.5px;line-height:1.25;font-weight:700;background:#fff}
.top>div{padding:2px 4px}
.top .tc{text-align:center;color:var(--navy);border-inline:2px solid #333;font-weight:800;font-size:8.5px}
.top .tc b{display:block;background:var(--red);color:#fff;font:400 24px/1.1 'Rozha One',serif;border:2px solid #fff;outline:2px solid var(--red);margin:2px 2px 1px}
.hd{flex:none;display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;gap:4px;padding:3px 6px;background:linear-gradient(#ffe27a,#ffd23d);border-bottom:2px solid #333}
.bx{text-align:center;font-weight:800;color:var(--red);font-size:11px;line-height:1.1}
.pl{display:block;background:var(--navy);color:#fff;border-radius:12px;border:2px solid #fff;outline:2px solid var(--navy);font:400 17px/1.2 'Rozha One',serif;margin:2px 6px}
.mn{text-align:center;position:relative}
.br{font:400 8px 'Rozha One',serif;color:var(--navy);letter-spacing:1px}
.mn h1{margin:0;font:400 clamp(26px,4.6vh,36px)/1.05 'Rozha One',serif;color:var(--red);-webkit-text-stroke:1.5px var(--navy)}
.nv{position:absolute;top:50%;transform:translateY(-50%);background:#fffa;border:0;border-radius:50%;width:26px;height:26px;font-weight:800;color:var(--navy);font-size:16px;line-height:1}
.sl{flex:none;background:var(--yel);text-align:center;font:800 9.5px Mukta;padding:2px;border-bottom:2px solid #333}
@media (max-height:760px){.sl{display:none}}
.g{flex:1;min-height:0;display:grid;grid-template-columns:46px repeat(var(--n),1fr);grid-template-rows:repeat(7,minmax(0,1fr));background:var(--frame,#2e7fb8)}
.wd{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;color:#fff;font:400 clamp(11px,1.9vh,16px) 'Rozha One',serif;border-bottom:2px solid #fff;text-shadow:0 1px 2px #000}
.wd.rs{background:#c62828}
.wd svg{width:clamp(20px,4vh,34px);height:auto;filter:drop-shadow(0 2px 2px #0009)}
.c{background:#fff;border:1px solid #777;min-height:0;display:grid;grid-template-columns:.9em 1fr .9em;grid-template-rows:auto minmax(18px,1fr) auto auto;font:700 clamp(6.3px,1.02vh,8.4px)/1.12 Mukta;position:relative;overflow:hidden}
.c i{font-style:normal}
.c.sun{background:var(--yel)}
.c.hl{background:#ffe0e0}
.c.e{background:#d9d2b8}
.c.now{background:#fff3b0;box-shadow:inset 0 0 0 3px var(--red),0 0 12px 3px #ffb300;z-index:2;animation:glow 1.5s ease-in-out infinite}
@keyframes glow{50%{box-shadow:inset 0 0 0 3px var(--red),0 0 3px 0 #ffb300}}
.c.now .dt{background:var(--red);color:#fff;-webkit-text-stroke:0;border-radius:50%;width:1.45em;height:1.45em;display:grid;place-items:center}
.c.now .hex{background:var(--navy)}
.nk{grid-column:1/3;padding:1px 0 0 2px}
.hj{grid-column:3;font-size:.9em;color:#555;text-align:center}
.vl,.vr{writing-mode:vertical-rl;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;height:100%;align-self:center;font-size:.95em}
.vl{transform:rotate(180deg);color:var(--red)}
.vr{color:#444}
.dt,.hex{grid-column:2;grid-row:2;place-self:center;font:400 clamp(20px,3.9vh,31px)/1 'Rozha One',serif;color:var(--blue);-webkit-text-stroke:.7px var(--blue)}
.hex{width:clamp(28px,4.8vh,38px);height:clamp(31px,5.3vh,42px);display:grid;place-items:center;background:var(--red);color:#fff;-webkit-text-stroke:0;font-size:clamp(16px,3vh,22px);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.tt{grid-column:1/4;text-align:center;padding:0 1px}
.sp{grid-column:1/4;text-align:center;color:var(--red);padding:0 1px 1px;min-height:1em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.c.hl .tt{color:var(--red)}
.hdl{flex:none;display:flex;align-items:center;justify-content:space-between;background:var(--navy);color:#fff;font:800 11px Mukta;padding:3px 8px;touch-action:none}
.hdl button{background:var(--gold);color:var(--navy);border:0;border-radius:10px;padding:2px 12px;font:800 11px Mukta}
.hdl span{animation:bob 1.6s infinite}
@keyframes bob{50%{opacity:.5}}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:auto;background:var(--card);color:#1a1a1a;border:2px solid #333;border-radius:16px 16px 0 0;padding:14px;transform:translateY(110%);transition:transform .3s;z-index:9;max-height:70%;overflow:auto;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#sheet.on{transform:none}
#sheet h2{margin:0 0 6px;font:400 22px 'Rozha One',serif;color:var(--red)}
#sheet p{margin:3px 0;font-size:14px}
.c4{background:linear-gradient(145deg,#ff6b6b,#b3121c);box-shadow:0 4px 0 #7a0c13,0 8px 10px #0004}
.c5{background:linear-gradient(145deg,#a06bdc,#5b2a9e);box-shadow:0 4px 0 #3a1a68,0 8px 10px #0004}
#app.no-top .top,#app.no-sl .sl,#app.no-hj .hj,#app.no-vrat .vl,#app.no-bh .vr,#app.no-pl .wd svg{display:none}
#app.no-hr .c.hl{background:#fff}#app.no-hr .hex{background:var(--blue)}
</style></head>
<body>

<button data-v="jm"><span class="ic c2"><svg viewBox="0 0 32 32"><g class="fl"><path d="M16 3c3.2 4.2 4.6 6.6 4.6 9.4a4.6 4.6 0 01-9.2 0C11.4 9.6 12.8 7.2 16 3z" fill="#ffe27a"/><path d="M16 9c1.5 2 2.2 3.2 2.2 4.5a2.2 2.2 0 01-4.4 0C13.8 12.2 14.5 11 16 9z" fill="#ff7a1a"/></g><path d="M3 18h26c0 6-5.5 10-13 10S3 24 3 18z" fill="#f2b632" stroke="#8a5a1f" stroke-width="1.2"/><ellipse cx="16" cy="18" rx="13" ry="2.4" fill="#ffe08a" stroke="#8a5a1f"/></svg></span>मुहूर्त · जयंती</button>

</nav>
<div id="sheet"></div>
</div>

<script>
let CFG={name:'VISHWAKARMA JI',sym:'🕉',slogan:'',swipe:true,nav:null},CE={};
const $=s=>document.querySelector(s),dv=n=>String(n).replace(/\d/g,d=>'०१२३४५६७८९'[d]);

const WD=['रवि','सोम','मंगल','बुध','गुरु','शुक्र','शनि'];
const MO=['जनवरी','फ़रवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितम्बर','अक्टूबर','नवम्बर','दिसम्बर'];
const GR=['radial-gradient(circle at 35% 35%,#ffd23d,#f08a00)','radial-gradient(circle at 35% 35%,#9bb5ff,#3a3fa8)','radial-gradient(circle at 35% 35%,#ff9a5a,#b8321a)','radial-gradient(circle at 35% 35%,#8fd0ff,#2d4a78)','radial-gradient(circle at 35% 35%,#f4d9a8,#a8742f)','radial-gradient(circle at 35% 35%,#cfe3ff,#4a6ca8)','radial-gradient(circle at 35% 35%,#f5e0a0,#8a5a1f)'];
const PL=[`<g stroke=#e65100 stroke-width=2 stroke-linecap=round><path d=M18,2v5M18,29v5M2,18h5M29,18h5M7,7l3,3M26,26l3,3M7,29l3,-3M26,10l3,-3 /></g><circle cx=18 cy=18 r=9 fill=#ffc107 stroke=#e65100 stroke-width=1.5 />`,`<circle cx=18 cy=18 r=16 fill=#3a49b8 stroke=#fff /><circle cx=16 cy=18 r=10 fill=#fff /><circle cx=21 cy=16 r=9 fill=#3a49b8 />`,`<circle cx=18 cy=18 r=15 fill=#d84315 stroke=#7f1d0a /><circle cx=12 cy=13 r=3 fill=#a52a0f /><circle cx=23 cy=21 r=4 fill=#a52a0f /><circle cx=13 cy=25 r=2 fill=#a52a0f />`,`<circle cx=18 cy=18 r=15 fill=#78909c stroke=#37474f /><circle cx=12 cy=14 r=3 fill=#546e7a /><circle cx=23 cy=20 r=4 fill=#546e7a /><circle cx=15 cy=26 r=2 fill=#546e7a />`,`<defs><clipPath id=cj><circle cx=18 cy=18 r=15 /></clipPath></defs><g clip-path=url(#cj)><rect width=36 height=36 fill=#ecc88f /><rect y=8 width=36 height=4 fill=#b9772f /><rect y=16 width=36 height=5 fill=#c98a45 /><rect y=25 width=36 height=3 fill=#a8662a /></g><circle cx=18 cy=18 r=15 fill=none stroke=#6d4318 /><ellipse cx=24 cy=22 rx=3 ry=1.6 fill=#c0392b />`,`<circle cx=18 cy=18 r=12 fill=#dbe9ff stroke=#5b86c9 stroke-width=1.5 /><circle cx=5 cy=6 r=1.3 fill=#fff /><circle cx=31 cy=7 r=1.3 fill=#fff /><circle cx=31 cy=30 r=1.3 fill=#fff /><circle cx=5 cy=30 r=1.3 fill=#fff />`,`<ellipse cx=18 cy=18 rx=17 ry=5 transform=rotate(-20,18,18) fill=none stroke=#8a5a1f stroke-width=2.5 /><circle cx=18 cy=18 r=9 fill=#f2cf7a stroke=#8a5a1f />`];

const VAPID='YOUR_VAPID_KEY';
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC={cal:$('[data-v=cal] svg').outerHTML,diya:$('[data-v=jm] svg').outerHTML,note:$('[data-v=nt] svg').outerHTML,
bell:'<svg viewBox="0 0 32 32"><path d="M16 4a7 7 0 00-7 7v6l-3 4h20l-3-4v-6a7 7 0 00-7-7z" fill="#ffd23d" stroke="#8a5a1f"/><circle cx="16" cy="25" r="3" fill="#fff"/></svg>',
star:'<svg viewBox="0 0 32 32"><path d="M16 3l3.8 8.2 8.9 1-6.6 6 1.9 8.8L16 22.6 8 27l1.9-8.8-6.6-6 8.9-1z" fill="#ffd23d" stroke="#8a5a1f"/></svg>',
gift:'<svg viewBox="0 0 32 32"><rect x="5" y="12" width="22" height="15" rx="2" fill="#fff"/><rect x="4" y="9" width="24" height="5" rx="1.5" fill="#ffd23d"/><path d="M16 9v18" stroke="#d3202a" stroke-width="3"/><path d="M16 9c-5-6-9 0-4 0M16 9c5-6 9 0 4 0" fill="none" stroke="#d3202a" stroke-width="2"/></svg>',
clock:'<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="#fff" stroke="#1f2f8f" stroke-width="2"/><path d="M16 9v7l5 3" stroke="#d3202a" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>'};
const CL={blue:1,orange:2,green:3,red:4,purple:5};
function buildNav(items){const nav=$('nav');nav.style.gridTemplateColumns='repeat('+items.length+',1fr)';
nav.innerHTML=items.map(n=>`<button data-v="${n.id}"><span class="ic c${CL[n.color]||1}">${IC[n.icon]||IC.star}</span>${esc(n.label)}</button>`).join('');
items.filter(n=>n.id[0]=='x'&&!$('#v-'+n.id)).forEach(n=>{const s=document.createElement('section');s.className='view';s.id='v-'+n.id;$('main').append(s)});
nav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.v));
const a=$('.view.on');if(a){const b=nav.querySelector('[data-v="'+a.id.slice(2)+'"]');b&&b.classList.add('on')}}
const og=go;go=function(v){const n=((CFG.nav)||[]).find(x=>x.id==v);if(n&&n.type=='link'&&n.url){window.open(n.url,'_blank');return}
og(v);if(n&&v[0]=='x'){$('#hs').textContent=n.label;$('#v-'+v).innerHTML=`<div class="card"><h3>${esc(n.label)}</h3><div style="white-space:pre-wrap;font-size:15px;line-height:1.6">${esc(n.body)}</div></div>`;dfix($('#v-'+v))}};
function applyCfg(c){const b=c.brand||{},t=c.theme||{},f=c.features||{},r=document.documentElement.style;
CFG.name=b.name||CFG.name;CFG.sym=b.sym||CFG.sym;CFG.slogan=b.slogan||'';CFG.swipe=f.swipe!==false;CFG.nav=c.nav||null;
['blue','navy','red','yel','gold'].forEach(k=>t[k]&&r.setProperty('--'+k,t[k]));t.frame&&r.setProperty('--frame',t.frame);
[['top','no-top'],['slogan','no-sl'],['hijri','no-hj'],['vrat','no-vrat'],['bharatiya','no-bh'],['planets','no-pl'],['holidayRed','no-hr']].forEach(([k,cl])=>$('#app').classList.toggle(cl,f[k]===false));
document.title=CFG.name;$('#hn').textContent=CFG.name;$('#hl').textContent=CFG.sym;
if(c.nav)buildNav(c.nav.filter(n=>n.on!==false));mount(cy,cm)}
function initPush(db){try{if(!('Notification' in window)||!firebase.messaging.isSupported())return;const m=firebase.messaging();
const ask=async()=>{try{if(await Notification.requestPermission()!='granted')return;const reg=await navigator.serviceWorker.register('firebase-messaging-sw.js');const t=await m.getToken({vapidKey:VAPID,serviceWorkerRegistration:reg});if(t)db.collection('tokens').doc(t).set({at:Date.now()})}catch(e){}};
if(Notification.permission=='granted')ask();else document.addEventListener('click',ask,{once:true});
m.onMessage(p=>{const d=document.createElement('div');d.textContent=(p.notification.title||'')+' – '+(p.notification.body||'');d.style.cssText='position:fixed;top:10px;left:10px;right:10px;background:#2b2b86;color:#fff;padding:12px;border-radius:12px;z-index:99;font:700 14px Mukta';document.body.append(d);setTimeout(()=>d.remove(),5000)})}catch(e){}}
try{const c=JSON.parse(localStorage.getItem('vj_cfg'));c&&applyCfg(c)}catch(e){}
if(FB.apiKey!='YOUR_API_KEY'){firebase.initializeApp(FB);const db=firebase.firestore();
db.doc('config/app').onSnapshot(s=>{if(s.exists){try{localStorage.setItem('vj_cfg',JSON.stringify(s.data()))}catch(e){}applyCfg(s.data())}});
db.collection('events').onSnapshot(q=>{CE={};q.forEach(d=>{const e=d.data(),p=String(e.date).split('-').map(Number),k=e.yearly?p[1]+'-'+p[2]:p[0]+'-'+p[1]+'-'+p[2];(CE[k]=CE[k]||[]).push({n:e.name,h:e.hol})});mount(cy,cm)});
initPush(db)}
</script>
</body></html>
